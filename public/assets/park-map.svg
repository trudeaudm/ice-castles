<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 2000 1400" width="2000" height="1400">
  <title>Ice Castles New Hampshire — storybook park map (placeholder artwork)</title>
  <desc>Placeholder illustration at 2000x1400. Replace with traced artwork at the same aspect ratio and every marker keeps its position.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#071528"/><stop offset="1" stop-color="#040d1b"/>
    </linearGradient>
    <linearGradient id="snow" x1="0.1" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#4a749f"/><stop offset="0.5" stop-color="#3a6089"/><stop offset="1" stop-color="#2b4b6e"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2ddb4"/><stop offset="1" stop-color="#d9be8d"/>
    </linearGradient>
    <linearGradient id="iceFace" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#eaf9ff"/><stop offset="1" stop-color="#9fd8f2"/>
    </linearGradient>
    <linearGradient id="iceSide" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#8ec9e8"/><stop offset="1" stop-color="#5b9ec4"/>
    </linearGradient>
    <linearGradient id="pondG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5fb6d8"/><stop offset="1" stop-color="#337fa8"/>
    </linearGradient>
    <radialGradient id="lampGlow"><stop offset="0" stop-color="#ffc978" stop-opacity=".55"/><stop offset="1" stop-color="#ffc978" stop-opacity="0"/></radialGradient>
    <radialGradient id="castleAura"><stop offset="0" stop-color="#a9ecff" stop-opacity=".38"/><stop offset="1" stop-color="#a9ecff" stop-opacity="0"/></radialGradient>
    <radialGradient id="mintAura"><stop offset="0" stop-color="#7fe8c8" stop-opacity=".22"/><stop offset="1" stop-color="#7fe8c8" stop-opacity="0"/></radialGradient>
    <radialGradient id="roseAura"><stop offset="0" stop-color="#ff9ec4" stop-opacity=".22"/><stop offset="1" stop-color="#ff9ec4" stop-opacity="0"/></radialGradient>

    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.09"/></feComponentTransfer>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>

    <!-- storybook firs: wobbly outlines, three tones -->
    <g id="fir1">
      <path d="M0 20 q-4 2 -13 1 q3 -6 8 -9 q-8 1 -14 -1 q5 -8 12 -13 q-7 0 -12 -2 q7 -11 19 -21 q12 10 19 21 q-5 2 -12 2 q7 5 12 13 q-6 2 -14 1 q5 3 8 9 q-9 1 -13 -1 Z"
            fill="#1f6b63" stroke="#0c3a3c" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M0 -25 q-8 9 -12 18 q6 1 12 -2 Z" fill="#dff3f7" opacity=".5"/>
      <rect x="-2.5" y="19" width="5" height="9" rx="2" fill="#43281a"/>
    </g>
    <g id="fir2">
      <path d="M0 16 q-4 2 -11 1 q3 -5 7 -8 q-7 1 -12 -1 q4 -7 10 -11 q-6 0 -10 -2 q6 -9 16 -18 q10 9 16 18 q-4 2 -10 2 q6 4 10 11 q-5 2 -12 1 q4 3 7 8 q-7 1 -11 -1 Z"
            fill="#2a7d6b" stroke="#0c3a3c" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M0 -21 q-7 8 -10 15 q5 1 10 -2 Z" fill="#dff3f7" opacity=".45"/>
      <rect x="-2" y="15" width="4" height="8" rx="2" fill="#43281a"/>
    </g>
    <g id="fir3">
      <path d="M0 12 q-3 2 -9 1 q2 -4 6 -7 q-6 1 -10 -1 q4 -6 9 -9 q-5 0 -8 -2 q5 -8 12 -14 q7 6 12 14 q-3 2 -8 2 q5 3 9 9 q-4 2 -10 1 q4 3 6 7 q-6 1 -9 -1 Z"
            fill="#18594f" stroke="#0c3a3c" stroke-width="2.2" stroke-linejoin="round"/>
      <rect x="-1.8" y="11" width="3.6" height="7" rx="1.8" fill="#43281a"/>
    </g>

    <!-- storybook hut, gently isometric -->
    <g id="hut">
      <path d="M-34 6 L0 -12 L34 6 L34 30 L0 46 L-34 30 Z" fill="#8d6a4f" stroke="#3a2415" stroke-width="3" stroke-linejoin="round"/>
      <path d="M0 -12 L34 6 L34 30 L0 46 Z" fill="#6f5240"/>
      <path d="M-42 8 L0 -22 L42 8 L0 20 Z" fill="#e9f6fb" stroke="#3a2415" stroke-width="3" stroke-linejoin="round"/>
      <path d="M-14 20 L-14 34 L0 42 L0 26 Z" fill="#ffcf86" stroke="#3a2415" stroke-width="2.4"/>
      <path d="M12 20 L12 32 L24 26 L24 14 Z" fill="#ffcf86" stroke="#3a2415" stroke-width="2.4" opacity=".8"/>
    </g>

    <!-- lantern post -->
    <g id="lamp">
      <circle cx="0" cy="-26" r="26" fill="url(#lampGlow)"/>
      <rect x="-2.2" y="-24" width="4.4" height="30" rx="2" fill="#2b3f52"/>
      <path d="M0 -38 l9 9 l-9 10 l-9 -10 Z" fill="#ffd08f" stroke="#2b3f52" stroke-width="2.2"/>
    </g>
  </defs>

  <!-- ================= backdrop ================= -->
  <rect width="2000" height="1400" fill="url(#sky)"/>
  <g opacity=".5">
    <circle cx="180" cy="90" r="1.7" fill="#cfe9f8"/><circle cx="520" cy="60" r="1.3" fill="#cfe9f8"/>
    <circle cx="900" cy="105" r="1.9" fill="#cfe9f8"/><circle cx="1320" cy="70" r="1.4" fill="#cfe9f8"/>
    <circle cx="1740" cy="95" r="1.7" fill="#cfe9f8"/><circle cx="1950" cy="230" r="1.3" fill="#cfe9f8"/>
    <circle cx="70" cy="330" r="1.5" fill="#cfe9f8"/><circle cx="1900" cy="1330" r="1.4" fill="#cfe9f8"/>
    <circle cx="120" cy="1350" r="1.6" fill="#cfe9f8"/>
  </g>

  <!-- ================= the island of snow (deckled, hand-drawn edge) ================= -->
  <g>
    <path id="islandShadow" d="M300 250 q220 -110 520 -80 q210 22 400 -14 q250 -46 400 90 q150 128 96 330 q-52 196 -240 300 q-190 104 -470 122 q-300 20 -560 -34 q-260 -54 -336 -230 q-76 -176 24 -330 q94 -146 166 -154 Z"
          fill="#0a1c31" transform="translate(14 22)" filter="url(#soft)" opacity=".85"/>
    <path d="M300 250 q220 -110 520 -80 q210 22 400 -14 q250 -46 400 90 q150 128 96 330 q-52 196 -240 300 q-190 104 -470 122 q-300 20 -560 -34 q-260 -54 -336 -230 q-76 -176 24 -330 q94 -146 166 -154 Z"
          fill="url(#snow)" stroke="#cfe9f8" stroke-width="5" stroke-linejoin="round" opacity=".98"/>
    <path d="M300 250 q220 -110 520 -80 q210 22 400 -14 q250 -46 400 90 q150 128 96 330 q-52 196 -240 300 q-190 104 -470 122 q-300 20 -560 -34 q-260 -54 -336 -230 q-76 -176 24 -330 q94 -146 166 -154 Z"
          fill="none" stroke="#8fc4e3" stroke-width="1.6" stroke-dasharray="3 9" transform="translate(0 12) scale(1 0.985)" opacity=".6"/>
  </g>
  <rect width="2000" height="1400" filter="url(#grain)" opacity=".55" style="mix-blend-mode:overlay"/>

  <!-- ambient zone auras -->
  <ellipse cx="620" cy="690" rx="380" ry="300" fill="url(#castleAura)"/>
  <ellipse cx="540" cy="330" rx="330" ry="210" fill="url(#mintAura)"/>
  <ellipse cx="1600" cy="640" rx="380" ry="330" fill="url(#mintAura)"/>
  <ellipse cx="1420" cy="1050" rx="230" ry="160" fill="url(#roseAura)"/>

  <!-- ================= frozen pond ================= -->
  <g>
    <path d="M842 762 q118 -74 252 -34 q124 38 96 132 q-28 94 -182 106 q-162 12 -206 -70 q-42 -84 40 -134 Z"
          fill="url(#pondG)" stroke="#e6f8ff" stroke-width="5" stroke-linejoin="round" opacity=".95"/>
    <g stroke="#ffffff" fill="none" stroke-width="3" opacity=".45" stroke-linecap="round">
      <path d="M892 800 q92 -30 202 8"/><path d="M902 884 q120 30 224 -22"/><path d="M960 838 q70 -14 130 6"/>
    </g>
  </g>

  <!-- ================= trails: cream ribbons with ink edges ================= -->
  <g fill="none" stroke="#3a2415" stroke-width="42" stroke-linecap="round" stroke-linejoin="round" opacity=".35">
    <path d="M212 1246 L400 1162 L560 1020 L620 858"/>
    <path d="M620 858 L520 618 L482 420 L560 300 L700 262"/>
    <path d="M560 1020 L860 1158 L1150 1180"/>
    <path d="M1150 1180 L1420 1058 L1690 900 L1782 620 L1560 390 L1250 306 L1010 456 L900 640 L620 720"/>
    <path d="M400 1162 L300 962"/>
  </g>
  <g fill="none" stroke="url(#trail)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round">
    <path d="M212 1246 L400 1162 L560 1020 L620 858"/>
    <path d="M620 858 L520 618 L482 420 L560 300 L700 262"/>
    <path d="M560 1020 L860 1158 L1150 1180"/>
    <path d="M1150 1180 L1420 1058 L1690 900 L1782 620 L1560 390 L1250 306 L1010 456 L900 640 L620 720"/>
    <path d="M400 1162 L300 962"/>
  </g>
  <g fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-dasharray="14 20" opacity=".45">
    <path d="M212 1246 L400 1162 L560 1020 L620 858"/>
    <path d="M620 858 L520 618 L482 420 L560 300 L700 262"/>
    <path d="M560 1020 L860 1158 L1150 1180"/>
    <path d="M1150 1180 L1420 1058 L1690 900 L1782 620 L1560 390 L1250 306 L1010 456 L900 640 L620 720"/>
  </g>

  <!-- tubing hill: hand-drawn contour hatching -->
  <g fill="none" stroke="#cfe9f8" stroke-width="3" opacity=".4" stroke-linecap="round">
    <path d="M756 1232 q92 -112 224 -82"/><path d="M778 1274 q102 -132 254 -96"/><path d="M800 1314 q112 -152 284 -112"/>
    <path d="M830 1200 l-14 -26"/><path d="M900 1186 l-12 -28"/><path d="M970 1188 l-10 -28"/>
  </g>

  <!-- ================= the ice castle ================= -->
  <g transform="translate(620 682)">
    <!-- back towers -->
    <g>
      <path d="M-150 60 L-150 -50 L-124 -96 L-98 -50 L-98 60 Z" fill="url(#iceSide)" stroke="#2f6f95" stroke-width="3" stroke-linejoin="round"/>
      <path d="M98 60 L98 -50 L124 -96 L150 -50 L150 60 Z" fill="url(#iceSide)" stroke="#2f6f95" stroke-width="3" stroke-linejoin="round"/>
    </g>
    <!-- main keep -->
    <path d="M-104 96 L-104 -34 L-62 -96 L0 -140 L62 -96 L104 -34 L104 96 Z"
          fill="url(#iceFace)" stroke="#2f6f95" stroke-width="4" stroke-linejoin="round"/>
    <path d="M0 -140 L62 -96 L104 -34 L104 96 L0 128 Z" fill="url(#iceSide)" opacity=".85"/>
    <!-- icicle fringe -->
    <g fill="#f2fcff" opacity=".9">
      <path d="M-104 96 l10 26 l10 -26 Z"/><path d="M-74 96 l10 32 l10 -32 Z"/><path d="M-44 96 l9 22 l9 -22 Z"/>
      <path d="M-14 96 l10 30 l10 -30 Z"/><path d="M18 94 l9 24 l9 -24 Z"/><path d="M50 90 l9 28 l9 -28 Z"/>
      <path d="M82 84 l9 22 l9 -22 Z"/>
    </g>
    <!-- carved arch + window -->
    <path d="M-26 96 L-26 24 q26 -30 52 0 L26 96 Z" fill="#1c4f73" stroke="#2f6f95" stroke-width="3"/>
    <path d="M-12 4 q12 -16 24 0 L12 -20 q-12 -12 -24 0 Z" fill="#ffd08f" opacity=".8"/>
    <!-- spire pennants -->
    <g stroke="#2f6f95" stroke-width="2.4">
      <path d="M0 -140 L0 -176" fill="none"/><path d="M0 -176 l26 9 l-26 10 Z" fill="#7fe8c8"/>
      <path d="M-124 -96 L-124 -122" fill="none"/><path d="M-124 -122 l18 6 l-18 7 Z" fill="#ff9ec4"/>
      <path d="M124 -96 L124 -122" fill="none"/><path d="M124 -122 l18 6 l-18 7 Z" fill="#ffd08f"/>
    </g>
    <g stroke="#eaf9ff" stroke-width="2" opacity=".55" fill="none">
      <path d="M-62 -96 L-62 90"/><path d="M62 -96 L62 84"/>
    </g>
  </g>

  <!-- ================= buildings ================= -->
  <use href="#hut" xlink:href="#hut" x="400" y="1148"/>
  <use href="#hut" xlink:href="#hut" x="1150" y="1168"/>
  <use href="#hut" xlink:href="#hut" x="212" y="1238"/>
  <use href="#lamp" xlink:href="#lamp" x="330" y="1122"/><use href="#lamp" xlink:href="#lamp" x="472" y="1140"/>
  <use href="#lamp" xlink:href="#lamp" x="1080" y="1148"/><use href="#lamp" xlink:href="#lamp" x="1222" y="1160"/>
  <use href="#lamp" xlink:href="#lamp" x="150" y="1206"/><use href="#lamp" xlink:href="#lamp" x="620" y="900"/>
  <use href="#lamp" xlink:href="#lamp" x="1418" y="1032"/><use href="#lamp" xlink:href="#lamp" x="1010" y="486"/>

  <!-- horse station corral fence -->
  <g stroke="#3a2415" stroke-width="4" opacity=".8" fill="none">
    <path d="M1060 1216 L1250 1216"/><path d="M1060 1230 L1250 1230"/>
    <path d="M1060 1206 L1060 1240"/><path d="M1120 1206 L1120 1240"/>
    <path d="M1190 1206 L1190 1240"/><path d="M1250 1206 L1250 1240"/>
  </g>

  <!-- ================= storybook forest ================= -->
  <g>
    <use href="#fir1" xlink:href="#fir1" x="308" y="196"/><use href="#fir2" xlink:href="#fir2" x="360" y="248"/><use href="#fir3" xlink:href="#fir3" x="252" y="300"/>
    <use href="#fir2" xlink:href="#fir2" x="424" y="192"/><use href="#fir1" xlink:href="#fir1" x="648" y="212"/><use href="#fir3" xlink:href="#fir3" x="712" y="288"/>
    <use href="#fir2" xlink:href="#fir2" x="772" y="216"/><use href="#fir1" xlink:href="#fir1" x="196" y="424"/><use href="#fir3" xlink:href="#fir3" x="268" y="482"/>
    <use href="#fir2" xlink:href="#fir2" x="348" y="562"/><use href="#fir1" xlink:href="#fir1" x="828" y="344"/><use href="#fir3" xlink:href="#fir3" x="884" y="428"/>
    <use href="#fir2" xlink:href="#fir2" x="176" y="664"/><use href="#fir1" xlink:href="#fir1" x="232" y="762"/><use href="#fir3" xlink:href="#fir3" x="196" y="868"/>
    <use href="#fir2" xlink:href="#fir2" x="748" y="486"/><use href="#fir1" xlink:href="#fir1" x="1104" y="228"/><use href="#fir2" xlink:href="#fir2" x="1424" y="216"/>
    <use href="#fir1" xlink:href="#fir1" x="1624" y="272"/><use href="#fir3" xlink:href="#fir3" x="1826" y="428"/><use href="#fir1" xlink:href="#fir1" x="1878" y="566"/>
    <use href="#fir2" xlink:href="#fir2" x="1858" y="736"/><use href="#fir1" xlink:href="#fir1" x="1806" y="892"/><use href="#fir3" xlink:href="#fir3" x="1652" y="1044"/>
    <use href="#fir2" xlink:href="#fir2" x="1498" y="1160"/><use href="#fir1" xlink:href="#fir1" x="1322" y="1216"/><use href="#fir3" xlink:href="#fir3" x="1246" y="1072"/>
    <use href="#fir2" xlink:href="#fir2" x="1556" y="756"/><use href="#fir1" xlink:href="#fir1" x="1424" y="622"/><use href="#fir3" xlink:href="#fir3" x="1326" y="486"/>
    <use href="#fir2" xlink:href="#fir2" x="1142" y="622"/><use href="#fir3" xlink:href="#fir3" x="1004" y="704"/><use href="#fir1" xlink:href="#fir1" x="624" y="1220"/>
    <use href="#fir2" xlink:href="#fir2" x="530" y="1176"/><use href="#fir3" xlink:href="#fir3" x="964" y="1266"/><use href="#fir1" xlink:href="#fir1" x="1748" y="1172"/>
    <use href="#fir2" xlink:href="#fir2" x="140" y="1052"/><use href="#fir3" xlink:href="#fir3" x="104" y="906"/><use href="#fir1" xlink:href="#fir1" x="1904" y="984"/>
    <use href="#fir3" xlink:href="#fir3" x="466" y="366"/><use href="#fir2" xlink:href="#fir2" x="612" y="352"/><use href="#fir1" xlink:href="#fir1" x="1688" y="640"/>
    <use href="#fir3" xlink:href="#fir3" x="1540" y="470"/><use href="#fir2" xlink:href="#fir2" x="1180" y="392"/>
  </g>

  <!-- fairy village: tiny lit doors -->
  <g transform="translate(300 962)">
    <g stroke="#3a2415" stroke-width="2.6">
      <path d="M-46 22 q0 -20 14 -20 q14 0 14 20 Z" fill="#7fc7f0"/>
      <path d="M-14 24 q0 -22 15 -22 q15 0 15 22 Z" fill="#ff9ec4"/>
      <path d="M20 22 q0 -18 13 -18 q13 0 13 18 Z" fill="#ffd08f"/>
    </g>
    <g fill="#fff6dc" opacity=".85">
      <circle cx="-32" cy="14" r="3.4"/><circle cx="1" cy="14" r="3.6"/><circle cx="33" cy="14" r="3.2"/>
    </g>
  </g>

  <!-- butterfly canopy -->
  <g transform="translate(1420 1058)" opacity=".95">
    <g stroke="#3a2415" stroke-width="2">
      <path d="M-52 -18 q-14 -16 -2 -22 q12 -6 14 12 q4 -18 16 -12 q12 6 -2 22 Z" fill="#ff9ec4"/>
      <path d="M14 -34 q-12 -14 -2 -19 q10 -5 12 10 q4 -15 14 -10 q10 5 -2 19 Z" fill="#c8a8ff"/>
      <path d="M-20 -56 q-11 -12 -2 -17 q9 -4 11 9 q3 -13 12 -9 q9 5 -2 17 Z" fill="#ffd08f"/>
    </g>
  </g>

  <!-- dragon roost silhouette -->
  <g transform="translate(1782 606)">
    <path d="M-44 26 q18 -28 46 -26 q-16 -18 4 -30 q10 20 30 18 q-14 16 -6 34 q-24 10 -74 4 Z"
          fill="#a86bd8" stroke="#3a2415" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="22" cy="-14" r="3.2" fill="#ffd08f"/>
  </g>

  <!-- deer herd silhouettes -->
  <g transform="translate(1690 902)" fill="#e9d6a8" stroke="#3a2415" stroke-width="2.4">
    <path d="M-30 20 l0 -16 l10 -8 l-2 -12 l6 8 l6 -8 l-2 12 l10 8 l0 16 Z"/>
    <path d="M20 22 l0 -12 l8 -6 l-2 -9 l5 6 l4 -6 l-1 9 l8 6 l0 12 Z" opacity=".8"/>
  </g>

  <!-- yeti tracks -->
  <g transform="translate(1250 306)" fill="#dff3f7" opacity=".65">
    <ellipse cx="-46" cy="34" rx="8" ry="12" transform="rotate(-14 -46 34)"/>
    <ellipse cx="-16" cy="46" rx="8" ry="12" transform="rotate(8 -16 46)"/>
    <ellipse cx="16" cy="34" rx="8" ry="12" transform="rotate(-10 16 34)"/>
    <ellipse cx="46" cy="48" rx="8" ry="12" transform="rotate(12 46 48)"/>
  </g>

  <!-- polar tundra floes -->
  <g transform="translate(1560 392)" fill="#eaf9ff" stroke="#2f6f95" stroke-width="3" opacity=".85">
    <path d="M-58 30 l24 -14 l30 4 l14 14 l-32 10 Z"/>
    <path d="M14 22 l22 -12 l26 6 l6 14 l-30 8 Z" opacity=".8"/>
  </g>

  <!-- ================= hand-lettered labels ================= -->
  <g font-family="Georgia, 'Iowan Old Style', serif" text-anchor="middle" fill="#eaf9ff">
    <g font-size="30" font-style="italic" opacity=".92">
      <text x="620" y="906" letter-spacing="2">The Ice Castle</text>
    </g>
    <g font-size="23" font-style="italic" opacity=".8" letter-spacing="1.5">
      <text x="524" y="150" transform="rotate(-3 524 150)">Mystic Forest</text>
      <text x="1250" y="222" transform="rotate(2 1250 222)">Yeti Bend</text>
      <text x="1592" y="330" transform="rotate(-2 1592 330)">Polar Tundra</text>
      <text x="1826" y="540" transform="rotate(4 1826 540)">Dragon Roost</text>
      <text x="1700" y="994" transform="rotate(-3 1700 994)">Deer Sanctuary</text>
      <text x="1408" y="1132" transform="rotate(2 1408 1132)">Butterfly Garden</text>
      <text x="1012" y="536" transform="rotate(-2 1012 536)">Bird Aviary</text>
      <text x="884" y="1256" transform="rotate(3 884 1256)">Tubing Hill</text>
      <text x="296" y="912" transform="rotate(-4 296 912)">Fairy Village</text>
      <text x="1150" y="1272" transform="rotate(2 1150 1272)">Horse Station</text>
      <text x="400" y="1226" transform="rotate(-2 400 1226)">Warming Hut</text>
      <text x="214" y="1318">Entrance</text>
    </g>
    <text x="966" y="848" font-size="19" font-style="italic" opacity=".6" letter-spacing="2">Frozen Pond</text>
  </g>

  <!-- compass rose -->
  <g transform="translate(1878 1268)" opacity=".8">
    <circle r="40" fill="#0e2740" stroke="#cfe9f8" stroke-width="2.5"/>
    <path d="M0 -30 l8 24 l-8 8 l-8 -8 Z" fill="#eaf9ff"/>
    <path d="M0 30 l8 -24 l-8 -8 l-8 8 Z" fill="#5b9ec4"/>
    <text y="-14" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#0e2740" font-weight="bold">N</text>
  </g>
</svg>
