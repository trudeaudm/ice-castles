# Render blueprint. Point Render at this repo and it provisions both pieces.
services:
  - type: web
    name: icecastles-guest-app
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    disk:
      name: icecastles-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: icecastles-db
          property: connectionString
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: DATA_DIR
        value: /var/data
      - key: NODE_VERSION
        value: "22"

databases:
  - name: icecastles-db
    plan: basic-256mb
    postgresMajorVersion: "16"
